[project]
name = "taxonomail"
version = "0.2.0"
description = "Discover a folder taxonomy for a mailbox with BERTopic and an LLM"
readme = "README.md"
authors = [
    { name = "Sören Prilop", email = "mail@soeren-prilop.de" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "bertopic>=0.17",
    "numpy>=2.1",
    "openai>=3.55.1",
    "pydantic>=2.9,<3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.scripts]
taxonomail = "taxonomail.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = [
    "bertopic", "bertopic.*", "hdbscan", "hdbscan.*", "umap", "umap.*",
]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
