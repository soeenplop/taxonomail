# Settings for `taxonomail run|classify|classify-mail --config <file>`. Every value shown is the default; leave out
# what you don't change.

# Every step uses an OpenAI-compatible endpoint. api_key_env names the environment variable
# that holds its key (never the key itself); .env is read too.

[naming]                 # names each cluster
model = "gpt-6.1-terra"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
max_tokens = 1000

[consolidation]          # merges the named clusters into folders
model = "gpt-6.2-astra"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
max_tokens = 16000

[embedding]
model = "text-embedding-3-small"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
batch_size = 64          # texts per request

[clustering]
n_neighbors = 15         # UMAP
n_components = 5         # UMAP
min_cluster_size = 10    # HDBSCAN
representatives = 8      # mails per cluster shown to the naming model
keywords = 10            # BERTopic keywords per cluster
seed = 0                 # UMAP random state

[taxonomy]
min_folders = 8
max_folders = 25
language = "English"     # language of folder and cluster names, e.g. "German"

[classification]         # Jev (TypeSafe), used by classify and classify-mail
model = "jev-latest"
base_url = "https://api.typesafe.ai/v1"
api_key_env = "TYPESAFE_API_KEY"
min_probability = 0.5    # below this, a mail stays where it is
timeout = 10             # seconds per request
workers = 8              # parallel requests in classify

[relevance]              # classify --stale-folder: old mail no longer worth keeping
min_probability = 0.8    # how sure Jev must be; in doubt a mail stays
min_age_days = 30        # younger mails are never moved there
# question = "Is this mail no longer worth keeping once it is a few weeks old?"
# stale = "..."          # what a mail that is no longer relevant looks like
# relevant = "..."       # what a mail worth keeping looks like
